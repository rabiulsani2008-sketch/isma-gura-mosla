<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- Outer red circle -->
  <circle cx="256" cy="256" r="240" fill="#D32F2F"/>
  <!-- First white border ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#ffffff" stroke-width="6"/>
  <!-- Second white border ring -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- ISM monogram - interlocking letters -->
  <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">
    <!-- I -->
    <text x="150" y="300" font-size="180" text-anchor="middle">I</text>
    <!-- S -->
    <text x="256" y="300" font-size="170" text-anchor="middle">S</text>
    <!-- M -->
    <text x="362" y="300" font-size="180" text-anchor="middle">M</text>
  </g>
  <!-- ISMA text below -->
  <text x="256" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="8">ISMA</text>
</svg>
